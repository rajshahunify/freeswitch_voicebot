services:
  voicebot-fs:
    build:
      context: .
      dockerfile: Dockerfile
    image: freeswitch-audio-fork:latest
    container_name: voicebot-fs

    # Standard FreeSWITCH ports
    ports:
      - "5060:5060/udp"      # SIP UDP
      - "5060:5060/tcp"      # SIP TCP
      - "5080:5080/udp"      # SIP Alt UDP
      - "5080:5080/tcp"      # SIP Alt TCP
      - "8021:8021/tcp"      # Event Socket Layer (ESL)
      - "5061:5061/udp"      # SIP TLS UDP
      - "5061:5061/tcp"      # SIP TLS TCP
      - "16384-16484:16384-16484/udp"  # RTP media ports

    environment:
      - TZ=UTC

    # Configs are baked into the image from 'make samples'
    # Do NOT mount a volume over /conf — it would override with an empty dir
    volumes:
      - freeswitch-logs:/usr/local/freeswitch/log:rw
      - freeswitch-recordings:/usr/local/freeswitch/recordings:rw

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

    cap_add:
      - SYS_NICE
      - NET_ADMIN

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/local/freeswitch/run/freeswitch.pid && kill -0 $(cat /usr/local/freeswitch/run/freeswitch.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  freeswitch-logs:
  freeswitch-recordings: